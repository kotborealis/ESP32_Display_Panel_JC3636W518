name: PlatformIO Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/PlatformIO/**'
      - '.github/workflows/platformio-build.yml'
  push:
    branches:
      - master
    paths:
      - 'examples/PlatformIO/**'
      - '.github/workflows/platformio-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install PlatformIO and ESP32 platform
        run: |
          pip install platformio
          pio platform install https://github.com/platformio/platform-espressif32.git#v6.9.0
      - name: Build firmware
        working-directory: examples/PlatformIO
        run: pio run
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: examples/PlatformIO/.pio/build/ESP-LCD/firmware.bin
